<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d">
<title id="t">How missed call text back works, step by step</title>
<desc id="d">Four steps. A customer rings and you cannot answer. The system notices the unanswered call. An automatic text goes to the caller within about a minute. The caller replies by text and the conversation carries on when you are free.</desc>
<defs>
  <style>
    .bg{fill:#0e1413}
    .card{fill:#141c1a;stroke:#232e2c;stroke-width:1.5}
    .phone{fill:#0f1a17;stroke:#1d4f3e;stroke-width:1.5}
    .h{font:600 16px Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e8eceb}
    .s{font:400 14px Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#9aa5a2}
    .msg{font:400 14px Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#cfd6d4}
    .big{font:600 26px Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#e8eceb}
    .t{font:600 12px Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.16em;fill:#5f6d6a}
    .arrow{stroke:#2e3a38;stroke-width:2;fill:none}
  </style>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e3a38"/></marker>
</defs>

<rect class="bg" width="1200" height="480"/>
<text class="big" x="48" y="56">Missed call text back, step by step</text>
<text class="s" x="48" y="84" font-size="15">The cheapest thing you can do about missed calls. It does not answer anything, it just stops the silence.</text>

<rect class="card" x="48" y="132" width="232" height="150" rx="12"/>
<text class="t" x="72" y="166">00:00</text>
<text class="h" x="72" y="196">They ring</text>
<text class="s" x="72" y="224">You are on a job and</text>
<text class="s" x="72" y="244">cannot get to the phone.</text>

<path class="arrow" marker-end="url(#a)" d="M280 207 L 316 207"/>

<rect class="card" x="324" y="132" width="232" height="150" rx="12"/>
<text class="t" x="348" y="166">00:30</text>
<text class="h" x="348" y="196">The call ends</text>
<text class="s" x="348" y="224">No voicemail left, which</text>
<text class="s" x="348" y="244">is the usual outcome.</text>

<path class="arrow" marker-end="url(#a)" d="M556 207 L 592 207"/>

<rect class="card" x="600" y="132" width="232" height="150" rx="12"/>
<text class="t" x="624" y="166">01:00</text>
<text class="h" x="624" y="196">A text goes out</text>
<text class="s" x="624" y="224">Automatically, from your</text>
<text class="s" x="624" y="244">business number.</text>

<path class="arrow" marker-end="url(#a)" d="M832 207 L 868 207"/>

<rect class="card" x="876" y="132" width="276" height="150" rx="12"/>
<text class="t" x="900" y="166">LATER</text>
<text class="h" x="900" y="196">They reply</text>
<text class="s" x="900" y="224">You pick it up at lunch, and</text>
<text class="s" x="900" y="244">the enquiry is still alive.</text>

<!-- sample message -->
<rect class="phone" x="48" y="324" width="700" height="88" rx="14"/>
<text class="t" x="76" y="356">WHAT THE TEXT MIGHT SAY</text>
<text class="msg" x="76" y="386">"Sorry I missed you, I'm on a job. What do you need doing and where? I'll ring you back today."</text>

<text class="s" x="776" y="362">Keep it short and human.</text>
<text class="s" x="776" y="384">Say when you will ring back,</text>
<text class="s" x="776" y="406">then actually ring back.</text>
</svg>
