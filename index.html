        <h1>Pulsemint: AI answering service for small businesses</h1>
        <p>Pulsemint answers the calls you cannot take. It collects the caller's name, number, the job and the address, and texts the details to you within about a minute, so you can ring back and keep the work.</p>

        <h2>What happens when you miss a call</h2>
        <ol>
          <li><strong>The call goes unanswered.</strong> You are up a ladder or on another call. After a few rings it passes to Pulsemint instead of voicemail.</li>
          <li><strong>It takes the details.</strong> It answers the call, then asks for their name, number, the job and the address. If a caller asks whether it is an AI, it says yes. It does not quote prices or promise dates.</li>
          <li><strong>You get it by text.</strong> A short summary lands on your phone within a minute. You ring back and win the job while they are still searching.</li>
        </ol>

        <h2>What it costs</h2>
        <p>The pilot is 14 days, free. Setting it up takes about ten minutes of your time because it is done for you. After that it is <strong>£199 a month</strong>, including up to 50 captured calls. No contract, cancel any time.</p>
        <p>You keep your current number; unanswered calls are passed on from it. If Pulsemint is ever unavailable, calls ring straight to your mobile as they did before, so you never end up worse off.</p>

        <h2>Common questions</h2>
        <h3>Will callers know it's an AI?</h3>
        <p>If they ask, yes. It does not open the call by announcing it, but if a caller asks whether they are speaking to an AI, it answers truthfully: yes, it is.</p>
        <h3>What happens to the call details?</h3>
        <p>They are sent to you. Callers are told the call may be recorded, and you get a short data-protection note for your records.</p>
        <h3>Is there a charge per call?</h3>
        <p>No. The monthly price covers it, up to the limit above.</p>
        <h3>What if I don't like it?</h3>
        <p>Say so and it gets switched off. The pilot is free, so you have lost nothing but ten minutes of setup.</p>

        <h2>Who runs it</h2>
        <p>I'm Shadman, based in Lowestoft, UK. I build and run Pulsemint myself; feel free to contact me with any enquiry. You deal with me directly, not a call centre. Email <a href="mailto:info@pulsemint.co.uk" style="color:#34d399">info@pulsemint.co.uk</a>.</p>
