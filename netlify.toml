[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Only rebuild when something outside social/ and .github/ changed. The
  # social publisher and lead listener commit to this repo several times a
  # day and none of it affects the site, so without this every one of those
  # commits burns a build. Netlify cancels the build when this exits 0.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)social' ':(exclude).github'"

# ALLOWED_HOSTS is just the public domain name (it appears in the site's own
# email address), so it isn't a secret. The API key and agent ID stay scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_HOSTS"

# The site calls /api/create-web-call so the same code works on any host.
# This rule must come before the single-page-app catch-all below.
[[redirects]]
  from = "/api/create-web-call"
  to = "/.netlify/functions/create-web-call"
  status = 200

# Single-page app: send every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
